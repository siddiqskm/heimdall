[tool.poetry]
name = "heimdall"
version = "0.1.1"
description = "Conversation gatekeeper with dwell-based routing"
authors = ["Siddiq Hussain"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/siddiqskm/heimdall"
homepage = "https://github.com/siddiqskm/heimdall"
documentation = "https://github.com/siddiqskm/heimdall#readme"
keywords = ["nlp", "conversation", "intent-classification", "routing", "sentence-transformers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

packages = [
    { include = "heimdall" }
]

# ---- Include non-Python assets in the wheel ----
include = [
    { path = "heimdall/models/lr.joblib", format = ["sdist", "wheel"] },
    { path = "heimdall/assets/prototypes_offline.json", format = ["sdist", "wheel"] },
]

[tool.poetry.dependencies]
python = "^3.12"
numpy = ">=1.21.4"
scikit-learn = ">=1.0.2"
sentence-transformers = ">=2.4.1"
joblib = ">=1.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "^0.15.0"
datasets = "2.18.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ------------------------------------------------------------------
# Ruff configuration
# ------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tests/results"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
]

ignore = [
    "E501",  # line length handled separately
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
